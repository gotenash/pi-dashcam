# ==============================================================================
# Configuration générale - Pi-Dashcam
# ==============================================================================
# Ce fichier est sourcé par dashcam.sh et lu par power_monitor.py et l'interface Web.
# Emplacement par défaut : /etc/pi-dashcam/dashcam.conf

# ------------------------------------------------------------------------------
# Enregistrement Vidéo
# ------------------------------------------------------------------------------
# Répertoire où sont enregistrés les fichiers vidéo
STORAGE_DIR="/var/media/dashcam"

# Durée de chaque segment vidéo en secondes (ex: 180 = 3 minutes)
SEGMENT_DURATION_SEC=180

# Résolution et fluidité
VIDEO_WIDTH=1920
VIDEO_HEIGHT=1080
VIDEO_FPS=30

# Débit vidéo en bps (8000000 = 8 Mbps, bon compromis qualité / taille pour 1080p)
VIDEO_BITRATE=8000000

# Format du nom de fichier vidéo (horodatage)
FILENAME_PREFIX="dashcam_"

# ------------------------------------------------------------------------------
# Gestion de l'espace disque & Rotation
# ------------------------------------------------------------------------------
# Pourcentage d'occupation maximale du disque avant purge des vidéos anciennes
MAX_DISK_USAGE_PERCENT=85

# Espace libre minimum requis en Mo (sécurité supplémentaire)
MIN_FREE_SPACE_MB=1024

# ------------------------------------------------------------------------------
# Module Alimentation & Batterie (UPS-Lite V1.2)
# ------------------------------------------------------------------------------
# Bus et adresse I2C pour la jauge MAX17040G
UPS_I2C_BUS=1
UPS_I2C_ADDR="0x36"

# Broche GPIO (BCM) pour la détection du branchement de l'alimentation externe
# Sur UPS-Lite V1.2 : GPIO 4 (Niveau HAUT = Alimenté, Niveau BAS = Sur batterie)
POWER_DETECT_PIN=4

# Activer ou désactiver l'extinction automatique (0 = Désactivé pour les tests, 1 = Activé en production)
ENABLE_AUTO_SHUTDOWN=0

# Délai de grâce en secondes avant extinction lors d'une coupure d'alimentation
SHUTDOWN_DELAY_SEC=30

# Seuil critique de batterie (%) en dessous duquel l'extinction est immédiate
CRITICAL_BATTERY_PERCENT=10

# Seuil critique de tension (V) pour protection matérielle de la cellule LiPo
CRITICAL_BATTERY_VOLTAGE=3.40

# Niveau de log (DEBUG, INFO, WARNING, ERROR)
LOG_LEVEL="INFO"

# ------------------------------------------------------------------------------
# Serveur Web & Point d'Accès Wi-Fi (Hotspot)
# ------------------------------------------------------------------------------
# Port d'écoute de l'interface de contrôle mobile
WEB_PORT=5000
WEB_HOST="0.0.0.0"

# Paramètres du point d'accès Wi-Fi (utilisés par scripts/setup_hotspot.sh)
HOTSPOT_SSID="Pi-Dashcam"
HOTSPOT_PASS="dashcam1234"
HOTSPOT_IP="192.168.4.1"

# ------------------------------------------------------------------------------
# Écran e-Paper (Waveshare 2.13" HAT V4)
# ------------------------------------------------------------------------------
# Activer l'affichage e-Paper (1 = Activé, 0 = Désactivé)
EPAPER_ENABLED=1

# Fréquence de rafraîchissement en secondes (mode partiel rapide)
EPAPER_REFRESH_SEC=20

# Nombre de rafraîchissements partiels avant un rafraîchissement complet anti-ghosting
EPAPER_FULL_REFRESH_INTERVAL=20
